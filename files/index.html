<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Directory Protected // aRo Engine</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --surface-glass: rgba(10, 17, 34, 0.88);
            --border-neon: rgba(0, 255, 204, 0.35);
            --border-glow: rgba(0, 255, 204, 0.8);
            --neon-cyan: #00ffcc;
            --neon-purple: #9d4edd;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) var(--bg-deep);
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 204, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(157, 78, 221, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .shield-card {
            max-width: 500px;
            width: 100%;
            background: var(--surface-glass);
            border: 1px solid var(--border-neon);
            border-radius: 16px;
            padding: 30px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 255, 204, 0.15);
            backdrop-filter: blur(16px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .shield-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        }

        .shield-icon {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .redirect-btn {
            display: inline-block;
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid var(--border-neon);
            color: var(--neon-cyan);
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: bold;
            text-decoration: none;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .redirect-btn:hover {
            background: rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 20px var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .countdown-txt {
            margin-top: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="shield-card">
        <div class="shield-icon">🛡️</div>
        <h1>ACCESS RESTRICTED // FILES DIRECTORY</h1>
        <p>Direktori ini dilindungi oleh protokol enkripsi sistem. Akses langsung tidak diizinkan.</p>
        <a href="../" class="redirect-btn">[ KEMBALI KE BERANDA UTAMA ]</a>
        <div class="countdown-txt">Mengalihkan otomatis dalam <span id="sec">5</span> detik...</div>
    </div>

    <!-- Integrasi Anime.js & Script Utama -->
    <script src="files/js/anime.min.js"></script>
    <script src="files/js/main.js"></script>
    
    <script>
        let timeLeft = 5;
        const secEl = document.getElementById('sec');
        
        const timer = setInterval(() => {
            timeLeft--;
            if(secEl) secEl.innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = '../';
            }
        }, 1000);
    </script>
</body>
</html>
