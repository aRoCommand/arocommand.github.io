<!DOCTYPE html>
<html lang="id" data-theme="blood-moon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Elemen SEO On-Page -->
  <title>The Dark Catur ー Game Catur Interaktif</title>
  <meta name="description" content="Game Catur Interaktif: aRo.Is-a.Dev The Dark Catur, mini games untuk dimainkan 2±Player and vs Komputer">
  <meta name="robots" content="index, follow">
  <!-- Canonical URL -->
   <link rel="canonical" href="https://aro.is-a.dev/">
  <!-- Favicon Utama (Format ICO standar 32x32/48x48/64x64) -->
   <link rel="icon" href="./files/images/favicon/32x32/favicon.ico" sizes="32x32" type="image/x-icon">
   <link rel="icon" href="./files/images/favicon/48x48/favicon.ico" sizes="48x48" type="image/x-icon">
   <link rel="icon" href="./files/images/favicon/64x64/favicon.ico" sizes="64x64" type="image/x-icon">
  <!-- Apple Touch Icon (Untuk perangkat iOS/Safari - Ukuran umum 180x180) -->
   <link rel="apple-touch-icon"  href="./files/images/favicon/180x180/apple-touch-icon.png" sizes="180x180" type="image/png">
  <link rel="stylesheet" href="./Games/catur/files/css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header__brand-wrapper">
      <a href="/" class="header__logo">
        <span class="material-icons">extension</span> The Dark Catur
      </a>
      <button class="theme-switcher-btn" id="theme-toggler" title="Ganti Tema Warna & Font">
        <span class="material-icons">imagesearch_roller</span>
      </button>
    </div>
    <nav class="header__nav">
      <a href="#" class="header__link header__link--active" id="nav-home"><span class="material-icons">sports_esports</span> Catur</a>
      <a class="header__link" id="nav-rules"><span class="material-icons">menu_book</span> Cara Bermain</a>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="game-container">
      <h1 class="game-title">Dark Catur Arena</h1>
      
      <!-- PILIHAN MODE GAME -->
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="pve">vs Komputer</button>
        <button class="mode-btn" data-mode="pvp">2 Player</button>
      </div>

      <!-- PILIHAN TINGKAT KESULITAN -->
      <div class="difficulty-selector" id="difficulty-container">
        <button class="diff-btn active" data-level="easy">Easy</button>
        <button class="diff-btn" data-level="normal">Normal</button>
        <button class="diff-btn" data-level="hard">Hard</button>
      </div>

      <div class="game-status" id="turn-status">Giliran: Putih</div>

      <!-- PANEL LOG BIDAK TERMAKAN DENGAN SCROLL HORIZONTAL -->
      <div class="captured-panel">
        <div class="captured-row">
          <span class="captured-label">Putih dimakan:</span>
          <div class="captured-pieces-scroll" id="captured-white"></div>
        </div>
        <div class="captured-row">
          <span class="captured-label">Hitam dimakan:</span>
          <div class="captured-pieces-scroll" id="captured-black"></div>
        </div>
      </div>
      
      <div class="chess-wrapper">
        <div id="chess-board" class="chess-board"></div>
        <button class="btn" onclick="resetGame()">
          <span class="material-icons">refresh</span> Reset Game
        </button>
      </div>
    </div>
  </main>

  <!-- MODAL POP-UP UNTUK CARA BERMAIN -->
  <div class="modal-overlay" id="info-modal">
    <div class="modal-container">
      <div class="modal__header">
        <div class="modal__title" id="modal-title">Judul</div>
        <button class="modal__close" id="modal-close"><span class="material-icons">close</span></button>
      </div>
      <div class="modal__body" id="modal-content">
        Isi konten...
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; <span id="currentYear"></span> The Dark Catur Project. Seluruh hak cipta dilindungi.</p>
  </footer>
  
  <script src="./Games/catur/files/js/catur.js"></script>
  <script src="./Games/catur/files/js/fitur.js"></script>
</body>
</html>
